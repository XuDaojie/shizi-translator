name: Release

# 日常发版流程：
#   1. 本地 npm run release:bump（或 --beta）写版本、commit、打 tag
#   2. git push && git push --tags
#   3. 本 workflow 在 tag v* 上构建 NSIS 并挂到 GitHub Release
# 也可在 Actions 页手动 workflow_dispatch 重跑指定 tag。
# 主干每日滚动构建见 nightly.yml（固定 tag nightly，不进 semver 通道）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v0.7.0-beta.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag 必须以 v 开头: $TAG" >&2; exit 1 ;;
          esac
          PRERELEASE=false
          case "$TAG" in
            *-beta.*|*-alpha.*|*-rc.*) PRERELEASE=true ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # 双包：轻量（downloadBootstrapper）+ 完整（offlineInstaller，产物改名为 *-setup-full.exe）
      # 与本地 `npm run tauri:build:dual` 一致；应用内检查更新只指向轻量包。
      - name: Build dual NSIS installers
        run: npm run tauri:build:dual

      - name: List and verify dual artifacts
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/ || true
          shopt -s nullglob
          slim=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          full=(src-tauri/target/release/bundle/nsis/*-setup-full.exe)
          # 排除误匹配：*-setup-full.exe 也匹配 *-setup.exe 时用过滤
          slim_only=()
          for f in "${slim[@]}"; do
            base="$(basename "$f")"
            case "$base" in
              *-setup-full.exe) ;;
              *-setup.exe) slim_only+=("$f") ;;
            esac
          done
          if [ ${#slim_only[@]} -eq 0 ]; then
            echo "轻量 NSIS 安装包未生成 (*-setup.exe)" >&2
            find src-tauri/target/release -maxdepth 3 -type f \( -name '*.exe' -o -name '*.msi' \) -print || true
            exit 1
          fi
          if [ ${#full[@]} -eq 0 ]; then
            echo "完整 NSIS 安装包未生成 (*-setup-full.exe)" >&2
            exit 1
          fi
          echo "slim:"
          printf '  %s\n' "${slim_only[@]}"
          echo "full:"
          printf '  %s\n' "${full[@]}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # 由 GitHub 根据上一个 tag 到本 tag 的 commits/PRs 自动生成更新说明（附在 body 后）
          generate_release_notes: true
          body: |
            ## 安装包说明

            | 文件 | 用途 |
            |------|------|
            | `Shizi_*_x64-setup.exe` | **推荐**：轻量包。体积小；安装时若本机无 WebView2 会联网下载安装（系统共享 Runtime）。 |
            | `Shizi_*_x64-setup-full.exe` | **完整包**：内嵌 WebView2 离线安装器（约 +100MB+）。弱网 / 干净系统 / 安装轻量包失败时使用。装的是**系统级** WebView2，其它软件可共用。 |

            - 应用内「检查更新」**始终**打开轻量包下载链接（更新无需再带 WebView2 安装器）。
            - 已装过 WebView2 或用过完整包的用户，之后升级用轻量包即可。
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup-full.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
